      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Prepare build directory
        run: mkdir -p build

      - name: Configure GOPRIVATE and fetch modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          go env -w GOPRIVATE=github.com/Yeah114/*
          mkdir -p modules
          echo "Checking local replace modules..."
          if [ ! -f modules/WaterStructure/go.mod ]; then
            echo "Cloning Yeah114/WaterStructure into modules/WaterStructure"
            if [ -z "${GH_PAT}" ]; then
              echo "Error: GH_PAT secret is not set. Please add a Personal Access Token with repo scope to repository secrets as GH_PAT."
              exit 1
            fi
            git clone --depth 1 https://${GH_PAT}@github.com/Yeah114/WaterStructure.git modules/WaterStructure
          else
            echo "Found modules/WaterStructure"
          fi
          if [ ! -f modules/blocks/go.mod ]; then
            echo "Cloning Yeah114/blocks into modules/blocks"
            if [ -z "${GH_PAT}" ]; then
              echo "Error: GH_PAT secret is not set. Please add a Personal Access Token with repo scope to repository secrets as GH_PAT."
              exit 1
            fi
            git clone --depth 1 https://${GH_PAT}@github.com/Yeah114/blocks.git modules/blocks
          else
            echo "Found modules/blocks"
          fi
          if [ ! -f modules/g79client/go.mod ]; then
            echo "Cloning Yeah114/g79client into modules/g79client"
            if [ -z "${GH_PAT}" ]; then
              echo "Error: GH_PAT secret is not set. Please add a Personal Access Token with repo scope to repository secrets as GH_PAT."
              exit 1
            fi
            git clone --depth 1 https://${GH_PAT}@github.com/Yeah114/g79client.git modules/g79client
          else
            echo "Found modules/g79client"
          fi
          if [ ! -f modules/FunShuttler/go.mod ]; then
            echo "Cloning Yeah114/FunShuttler into modules/FunShuttler"
            if [ -z "${GH_PAT}" ]; then
              echo "Error: GH_PAT secret is not set. Please add a Personal Access Token with repo scope to repository secrets as GH_PAT."
              exit 1
            fi
            git clone --depth 1 --branch main https://${GH_PAT}@github.com/Yeah114/FunShuttler.git modules/FunShuttler
          else
            echo "Found modules/FunShuttler"
          fi

      - name: Generate constants
        run: go generate ./constants

      - name: Build Windows arm64
        run: |
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
          garble -literals -tiny -seed=random build \
            -ldflags "-s -w -checklinkname=0" \
            -o build/Fatalder-cli_windows_arm64.exe \
            -v github.com/Yeah114/Fatalder/cmd/cli

      - name: Compute SHA512
        run: |
          sha512sum build/Fatalder-cli_windows_arm64.exe | awk '{print $1}' > build/Fatalder-cli_windows_arm64.exe.sha

      - name: Upload asset to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          gh release upload "$tag" build/Fatalder-cli_windows_arm64.exe --repo Yeah114/Fatalder-Release --clobber
          gh release upload "$tag" build/Fatalder-cli_windows_arm64.exe.sha --repo Yeah114/Fatalder-Release --clobber