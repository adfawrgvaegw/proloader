name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: |
            third_party/fatalder/go.sum
            tools/blockmapper/go.sum
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,web]'
      - name: Python tests
        run: python -m pytest -q
      - name: Native builds and tests
        working-directory: third_party/fatalder
        run: |
          go build -o /tmp/proloader-plan ./cmd/proloader-plan
          go build -o /tmp/proloader-nbt ./cmd/proloader-nbt
          go build -o /tmp/proloader-world ./cmd/proloader-world
          go build -o /tmp/fatalder-upstream ./cmd/cli
          go test ./cmd/proloader-nbt ./cmd/proloader-world
      - name: New offline helpers
        run: |
          for helper in mcpcheck worldreader nbtcodec bdxreader; do
            (cd tools/$helper && go test ./... && go vet ./...)
          done
