<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>proloader · 3D 建筑导入可视化</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel-2: #222636;
    --border: #2d3142;
    --text: #e4e7ef;
    --text-dim: #8b91a7;
    --accent: #6c8cff;
    --accent-2: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display: flex; height: 100vh; }

  /* ── 侧边栏 ── */
  #sidebar {
    width: 340px; min-width: 340px; background: var(--panel);
    border-right: 1px solid var(--border); overflow-y: auto;
    display: flex; flex-direction: column;
  }
  #sidebar header {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #1a1d27, #232838);
  }
  #sidebar header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  #sidebar header h1 span { color: var(--accent); }
  #sidebar header p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-dim); margin-bottom: 12px; font-weight: 600;
  }

  /* 结构列表 */
  .struct-item {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; transition: all .15s;
  }
  .struct-item:hover { border-color: var(--accent); }
  .struct-item.active { border-color: var(--accent); background: #2a3050; }
  .struct-item .name { font-weight: 600; font-size: 14px; }
  .struct-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .empty-hint { color: var(--text-dim); font-size: 13px; padding: 8px 0; }

  /* 表单 */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .checkbox-field input { width: auto; }

  /* 按钮 */
  .btn {
    width: 100%; padding: 10px 14px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5a7bf0; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  /* 进度条 */
  .progress-wrap { margin-top: 8px; }
  .progress-bar {
    height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .2s; width: 0%;
  }
  .progress-text {
    display: flex; justify-content: space-between; font-size: 12px;
    color: var(--text-dim); margin-top: 6px;
  }
  .progress-text .pct { color: var(--accent-2); font-weight: 600; }

  /* 统计 */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .stat {
    background: var(--panel-2); border-radius: 6px; padding: 8px 10px; text-align: center;
  }
  .stat .val { font-size: 18px; font-weight: 700; }
  .stat .lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
  .stat.placed .val { color: var(--accent-2); }
  .stat.failed .val { color: var(--danger); }

  /* bot 状态 */
  .bots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .bot-chip {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 3px 10px; font-size: 11px; color: var(--text-dim);
  }
  .bot-chip.active { border-color: var(--accent-2); color: var(--accent-2); }

  /* ── 3D 画布 ── */
  #canvas-container { flex: 1; position: relative; }
  #three-canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: absolute; top: 16px; right: 16px;
    background: rgba(26,29,39,.85); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: var(--text-dim);
    pointer-events: none;
  }
  #hud .row { display: flex; gap: 14px; }
  #hud .row span b { color: var(--text); }

  #view-controls {
    position: absolute; bottom: 16px; left: 16px;
    display: flex; gap: 6px;
  }
  #view-controls button {
    background: rgba(26,29,39,.85); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text-dim); font-size: 12px; cursor: pointer;
    transition: all .15s;
  }
  #view-controls button:hover { color: var(--text); border-color: var(--accent); }

  /* loading 遮罩 */
  #loading {
    position: absolute; inset: 0; background: rgba(15,17,23,.8);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px; z-index: 10;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* toast */
  #toast {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 18px; font-size: 13px; z-index: 20;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: var(--danger); color: var(--danger); }
  #toast.success { border-color: var(--accent-2); color: var(--accent-2); }

  .file-input-wrap { position: relative; }
  .file-input-wrap input[type=file] { display: none; }
</style>
</head>
<body>
<div id="app">
  <!-- ── 侧边栏 ── -->
  <aside id="sidebar">
    <header>
      <h1>pro<span>loader</span></h1>
      <p>3D 建筑导入可视化 · 差异增量 / 多假人并行 / 断点续传</p>
    </header>

    <!-- 建筑列表 -->
    <div class="section">
      <h2>建筑库</h2>
      <div id="struct-list"><p class="empty-hint">暂无建筑，请上传或加载</p></div>
      <div class="file-input-wrap" style="margin-top:10px">
        <label class="btn btn-secondary" for="file-upload">⬆ 上传建筑文件</label>
        <input type="file" id="file-upload" accept=".bdx,.mcstructure,.schem,.schematic">
      </div>
    </div>

    <!-- 导入控制 -->
    <div class="section">
      <h2>导入配置</h2>
      <div class="field-row">
        <div class="field">
          <label>原点 X</label>
          <input type="number" id="origin-x" value="0">
        </div>
        <div class="field">
          <label>原点 Y</label>
          <input type="number" id="origin-y" value="0">
        </div>
        <div class="field">
          <label>原点 Z</label>
          <input type="number" id="origin-z" value="0">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>假人数量</label>
          <input type="number" id="num-bots" value="3" min="1" max="16">
        </div>
        <div class="field">
          <label>切块大小</label>
          <input type="number" id="cell-size" value="16" min="4">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>模拟延迟(秒)</label>
          <input type="number" id="place-delay" value="0" min="0" step="0.001">
        </div>
      </div>
      <label class="checkbox-field">
        <input type="checkbox" id="use-diff" checked>
        差异增量导入（只放改变的方块）
      </label>
      <button class="btn btn-primary" id="btn-import" style="margin-top:12px" disabled>
        ▶ 开始导入
      </button>
    </div>

    <!-- 进度 -->
    <div class="section" id="progress-section" style="display:none">
      <h2>导入进度</h2>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
        <div class="progress-text">
          <span id="prog-detail">0 / 0</span>
          <span class="pct" id="prog-pct">0%</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat placed"><div class="val" id="stat-placed">0</div><div class="lbl">已放置</div></div>
        <div class="stat failed"><div class="val" id="stat-failed">0</div><div class="lbl">失败</div></div>
      </div>
      <div class="bots" id="bot-list"></div>
      <button class="btn btn-danger" id="btn-cancel" style="margin-top:12px">■ 取消</button>
    </div>

    <!-- 会话历史 -->
    <div class="section">
      <h2>会话历史</h2>
      <div id="session-list"><p class="empty-hint">暂无会话</p></div>
    </div>
  </aside>

  <!-- ── 3D 画布 ── -->
  <main id="canvas-container">
    <canvas id="three-canvas"></canvas>
    <div id="hud">
      <div class="row">
        <span>方块: <b id="hud-blocks">0</b></span>
        <span>FPS: <b id="hud-fps">0</b></span>
        <span>视角: <b id="hud-view">透视</b></span>
      </div>
    </div>
    <div id="view-controls">
      <button data-view="perspective">透视</button>
      <button data-view="top">俯视</button>
      <button data-view="front">正视</button>
      <button data-view="iso">等距</button>
      <button id="btn-toggle-preview">⬤ 预览模式</button>
    </div>
    <div id="loading" class="hidden"><div class="spinner"></div><span id="loading-text">加载中...</span></div>
    <div id="toast"></div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ════════════════════════════════════════════════════════════════════════════
// 全局状态
// ════════════════════════════════════════════════════════════════════════════
const State = {
  structures: [],        // [{id, name, size, block_count}]
  currentStructId: null, // 当前选中的建筑 id
  blocksPayload: null,   // 当前建筑的方块数据
  session: null,         // 当前导入会话 {session_id, ...}
  ws: null,              // WebSocket 连接
  placedSet: new Set(),  // 已放置方块的 instance index 集合
  botStats: {},          // {backend_id: {placed, failed, active}}
};

// ════════════════════════════════════════════════════════════════════════════
// Three.js 场景
// ════════════════════════════════════════════════════════════════════════════
let scene, camera, renderer, controls;
let instancedMesh = null;
let blockIndexMap = new Map();   // "x,y,z" -> instanceIndex
let blockPositions = [];         // [[x,y,z], ...] 按 instance 顺序
let blockColors = [];            // 目标颜色 [r,g,b] 0-1
let centroid = [0, 0, 0];
let previewMode = false;         // 预览模式：全亮 vs 导入模式：未放置暗
let fpsCounter = { last: performance.now(), frames: 0, fps: 0 };
const dimColor = new THREE.Color(0.18, 0.18, 0.22);  // 未放置（暗）
const highlightColor = new THREE.Color(1.2, 1.2, 1.2); // 放置瞬间高亮

function initThree() {
  const canvas = document.getElementById('three-canvas');
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1117);
  scene.fog = new THREE.Fog(0x0f1117, 80, 300);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(40, 40, 40);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // 光照
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(50, 80, 30);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x88aaff, 0.3);
  dir2.position.set(-40, 30, -20);
  scene.add(dir2);

  // 网格地面
  const grid = new THREE.GridHelper(200, 200, 0x2d3142, 0x1a1d27);
  grid.position.y = -0.01;
  scene.add(grid);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  const container = document.getElementById('canvas-container');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // FPS
  fpsCounter.frames++;
  const now = performance.now();
  if (now - fpsCounter.last >= 500) {
    fpsCounter.fps = Math.round(fpsCounter.frames * 1000 / (now - fpsCounter.last));
    document.getElementById('hud-fps').textContent = fpsCounter.fps;
    fpsCounter.frames = 0;
    fpsCounter.last = now;
  }
  renderer.render(scene, camera);
}

// ════════════════════════════════════════════════════════════════════════════
// 方块渲染（InstancedMesh）
// ════════════════════════════════════════════════════════════════════════════
function renderBlocks(payload) {
  // 清除旧 mesh
  if (instancedMesh) {
    scene.remove(instancedMesh);
    instancedMesh.geometry.dispose();
    instancedMesh.material.dispose();
  }
  blockIndexMap.clear();
  blockPositions = [];
  blockColors = [];
  State.placedSet.clear();

  const blocks = payload.blocks;
  const palette = payload.palette;
  const count = blocks.length;
  document.getElementById('hud-blocks').textContent = count;

  if (count === 0) return;

  // 计算质心（用于居中相机）
  let sx = 0, sy = 0, sz = 0;
  for (const b of blocks) { sx += b[0]; sy += b[1]; sz += b[2]; }
  centroid = [sx / count, sy / count, sz / count];

  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshLambertMaterial({ vertexColors: false });
  instancedMesh = new THREE.InstancedMesh(geo, mat, count);
  instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  const dummy = new THREE.Object3D();
  const color = new THREE.Color();

  for (let i = 0; i < count; i++) {
    const [x, y, z, palIdx] = blocks[i];
    // 居中到场景原点
    dummy.position.set(x - centroid[0], y - centroid[1], z - centroid[2]);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);

    const pal = palette[palIdx];
    const [r, g, b] = pal.color;
    const targetColor = new THREE.Color(r / 255, g / 255, b / 255);
    blockColors.push(targetColor);
    blockPositions.push([x, y, z]);
    blockIndexMap.set(`${x},${y},${z}`, i);

    // 初始颜色：预览模式全亮，导入模式暗
    if (previewMode) {
      instancedMesh.setColorAt(i, targetColor);
    } else {
      instancedMesh.setColorAt(i, dimColor);
    }
  }
  instancedMesh.instanceMatrix.needsUpdate = true;
  if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
  scene.add(instancedMesh);

  // 相机自适应
  fitCameraToBlocks(payload.size);
}

function fitCameraToBlocks(size) {
  const [sx, sy, sz] = size;
  const maxDim = Math.max(sx, sy, sz);
  const dist = maxDim * 1.4 + 10;
  camera.position.set(dist * 0.7, dist * 0.6, dist * 0.7);
  controls.target.set(0, sy / 2 - centroid[1], 0);
  controls.update();
}

// 高亮已放置方块（build-up 动画）
function highlightBlocks(blockList) {
  if (!instancedMesh) return;
  const color = new THREE.Color();
  for (const [x, y, z, opType] of blockList) {
    const idx = blockIndexMap.get(`${x},${y},${z}`);
    if (idx === undefined) continue;
    State.placedSet.add(idx);
    // 放置的方块设为目标颜色（全亮）
    instancedMesh.setColorAt(idx, blockColors[idx]);
  }
  if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
}

// 切换预览/导入模式
function setPreviewMode(isPreview) {
  previewMode = isPreview;
  if (!instancedMesh) return;
  const color = new THREE.Color();
  for (let i = 0; i < blockPositions.length; i++) {
    if (isPreview || State.placedSet.has(i)) {
      instancedMesh.setColorAt(i, blockColors[i]);
    } else {
      instancedMesh.setColorAt(i, dimColor);
    }
  }
  if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
}

// ════════════════════════════════════════════════════════════════════════════
// API 调用
// ════════════════════════════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  return res.json();
}

async function loadStructures() {
  try {
    State.structures = await api('GET', '/api/structures');
    renderStructList();
  } catch (e) { showToast('加载建筑列表失败: ' + e.message, 'error'); }
}

function renderStructList() {
  const el = document.getElementById('struct-list');
  if (State.structures.length === 0) {
    el.innerHTML = '<p class="empty-hint">暂无建筑，请上传或加载</p>';
    return;
  }
  el.innerHTML = State.structures.map(s => `
    <div class="struct-item ${s.id === State.currentStructId ? 'active' : ''}" data-id="${s.id}">
      <div class="name">${s.name}</div>
      <div class="meta">${s.size.join('×')} · ${s.block_count} 方块 · ${s.id}</div>
    </div>`).join('');
  el.querySelectorAll('.struct-item').forEach(item => {
    item.addEventListener('click', () => selectStructure(item.dataset.id));
  });
}

async function selectStructure(id) {
  State.currentStructId = id;
  showLoading('加载建筑数据...');
  try {
    const data = await api('GET', `/api/structures/${id}`);
    State.blocksPayload = data.blocks_payload;
    renderBlocks(data.blocks_payload);
    document.getElementById('btn-import').disabled = false;
    renderStructList();
    showToast(`已加载: ${data.name}`, 'success');
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

async function startImport() {
  if (!State.currentStructId) return;
  const body = {
    origin: [
      parseInt(document.getElementById('origin-x').value) || 0,
      parseInt(document.getElementById('origin-y').value) || 0,
      parseInt(document.getElementById('origin-z').value) || 0,
    ],
    num_bots: parseInt(document.getElementById('num-bots').value) || 3,
    cell_size: parseInt(document.getElementById('cell-size').value) || 16,
    use_diff: document.getElementById('use-diff').checked,
    place_delay: parseFloat(document.getElementById('place-delay').value) || 0,
  };
  try {
    const res = await api('POST', `/api/structures/${State.currentStructId}/import`, body);
    State.session = res;
    State.placedSet.clear();
    State.botStats = {};
    setPreviewMode(false);  // 切到导入模式（未放置暗）
    document.getElementById('progress-section').style.display = 'block';
    document.getElementById('btn-import').disabled = true;
    connectWebSocket(res.session_id);
  } catch (e) {
    showToast('启动导入失败: ' + e.message, 'error');
  }
}

// ════════════════════════════════════════════════════════════════════════════
// WebSocket 实时事件流
// ════════════════════════════════════════════════════════════════════════════
function connectWebSocket(sessId) {
  if (State.ws) State.ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  State.ws = new WebSocket(`${proto}://${location.host}/ws/sessions/${sessId}`);

  State.ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    handleWsEvent(msg);
  };
  State.ws.onerror = () => showToast('WebSocket 连接错误', 'error');
  State.ws.onclose = () => { State.ws = null; };
}

function handleWsEvent(msg) {
  switch (msg.type) {
    case 'status':
      updateProgress(msg.placed || 0, msg.failed || 0, msg.total || 0);
      break;
    case 'progress':
      updateProgress(msg.placed, msg.failed, msg.total);
      if (msg.blocks && msg.blocks.length) highlightBlocks(msg.blocks);
      if (msg.backend_id) updateBotStat(msg.backend_id, msg.placed, msg.failed, true);
      break;
    case 'block_error':
      if (msg.backend_id) updateBotStat(msg.backend_id, 0, 1, true);
      break;
    case 'backend_done':
      if (msg.backend_id) updateBotStat(msg.backend_id, msg.placed, msg.failed, false);
      break;
    case 'done':
      updateProgress(msg.placed, msg.failed, msg.total);
      setPreviewMode(true);  // 完成后全亮
      onImportDone(msg);
      break;
    case 'cancelled':
      showToast('导入已取消', 'error');
      onImportDone(msg);
      break;
    case 'error':
      showToast('错误: ' + msg.error, 'error');
      if (msg.done) onImportDone(msg);
      break;
    case 'heartbeat':
      break;
  }
}

function updateProgress(placed, failed, total) {
  const pct = total > 0 ? Math.min(100, (placed / total) * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct.toFixed(1) + '%';
  document.getElementById('prog-detail').textContent = `${placed} / ${total}`;
  document.getElementById('stat-placed').textContent = placed;
  document.getElementById('stat-failed').textContent = failed;
}

function updateBotStat(bid, placed, failed, active) {
  State.botStats[bid] = { placed, failed, active };
  renderBots();
}

function renderBots() {
  const el = document.getElementById('bot-list');
  const entries = Object.entries(State.botStats);
  if (entries.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = entries.map(([bid, s]) =>
    `<div class="bot-chip ${s.active ? 'active' : ''}">${bid}: ${s.placed}✓ ${s.failed}✗</div>`
  ).join('');
}

function onImportDone(msg) {
  document.getElementById('btn-import').disabled = false;
  if (State.ws) { State.ws.close(); State.ws = null; }
  if (msg.type === 'done') {
    showToast(`导入完成: ${msg.placed} 方块, 耗时 ${msg.elapsed?.toFixed(2)}s`, 'success');
  }
  loadSessions();
}

async function cancelImport() {
  if (!State.session) return;
  try {
    await api('POST', `/api/sessions/${State.session.session_id}/cancel`);
  } catch (e) { showToast('取消失败: ' + e.message, 'error'); }
}

// ════════════════════════════════════════════════════════════════════════════
// 会话历史
// ════════════════════════════════════════════════════════════════════════════
async function loadSessions() {
  try {
    const sessions = await api('GET', '/api/sessions');
    const el = document.getElementById('session-list');
    if (sessions.length === 0) { el.innerHTML = '<p class="empty-hint">暂无会话</p>'; return; }
    el.innerHTML = sessions.map(s => `
      <div class="struct-item">
        <div class="name">${s.session_id}</div>
        <div class="meta">${s.placed}/${s.total} 方块 · ${s.done ? '✓ 完成' : '运行中'}</div>
      </div>`).join('');
  } catch (e) { /* ignore */ }
}

// ════════════════════════════════════════════════════════════════════════════
// 视角控制
// ════════════════════════════════════════════════════════════════════════════
function setView(view) {
  document.getElementById('hud-view').textContent =
    { perspective: '透视', top: '俯视', front: '正视', iso: '等距' }[view];
  const size = State.blocksPayload?.size || [16, 16, 16];
  const [sx, sy, sz] = size;
  const maxDim = Math.max(sx, sy, sz);
  const d = maxDim * 1.4 + 10;
  switch (view) {
    case 'top':
      camera.position.set(0, d * 1.5, 0.01);
      break;
    case 'front':
      camera.position.set(0, sy / 2 - centroid[1], d);
      break;
    case 'iso':
      camera.position.set(d * 0.866, d * 0.7, d * 0.5);
      break;
    default:
      camera.position.set(d * 0.7, d * 0.6, d * 0.7);
  }
  controls.target.set(0, sy / 2 - centroid[1], 0);
  controls.update();
}

// ════════════════════════════════════════════════════════════════════════════
// UI 辅助
// ════════════════════════════════════════════════════════════════════════════
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 2500);
}

function showLoading(text = '加载中...') {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

// ════════════════════════════════════════════════════════════════════════════
// 事件绑定
// ════════════════════════════════════════════════════════════════════════════
document.getElementById('btn-import').addEventListener('click', startImport);
document.getElementById('btn-cancel').addEventListener('click', cancelImport);

document.getElementById('btn-toggle-preview').addEventListener('click', () => {
  setPreviewMode(!previewMode);
  document.getElementById('btn-toggle-preview').textContent =
    previewMode ? '⬂ 导入模式' : '⬤ 预览模式';
});

document.querySelectorAll('#view-controls button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});

document.getElementById('file-upload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showLoading('上传建筑文件...');
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/api/structures/upload', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('上传失败');
    await loadStructures();
    showToast('上传成功', 'success');
  } catch (err) {
    showToast('上传失败: ' + err.message, 'error');
  } finally {
    hideLoading();
    e.target.value = '';
  }
});

// ════════════════════════════════════════════════════════════════════════════
// 启动
// ════════════════════════════════════════════════════════════════════════════
initThree();
loadStructures();
loadSessions();
</script>
</body>
</html>
