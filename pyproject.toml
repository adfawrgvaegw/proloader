[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proloader"
version = "0.1.0"
description = "网易我的世界基岩版租赁服建筑导入器（实验性，源码分发）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "proloader contributors" }]
keywords = ["minecraft", "bedrock", "netease", "structure", "importer", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.24",
    "rich>=13.0",
    "requests>=2.31",
    "msgpack>=1.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "wsproto>=1.2",
    "python-multipart>=0.0.9",
]
cli = [
    "rich>=13.0",
]
bedrock = [
    "cryptography>=41.0",
]
netease = [
    # NeOmega 后端：ctypes 是标准库，msgpack 仅事件订阅时需要
    "msgpack>=1.0",
    "requests>=2.31",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.3",
]

[project.scripts]
proloader = "proloader.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["proloader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
